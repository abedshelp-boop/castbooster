<!DOCTYPE html>
<!--
  PREVIEW-ONLY harness. Not shipped with the extension; stubs chrome.* APIs
  so popup.js can render the idle layout in a plain browser tab.

  Toggle modes via ?mode= in the URL:
    ?mode=idle      → connected, no video on tab (default)
    ?mode=picker    → connected, candidates + devices available
    ?mode=err       → desktop app unreachable
    ?mode=playing   → active cast, video playing (Stage hero)
    ?mode=paused    → active cast, paused (Halo paused hero)
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Castbooster popup · preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup-styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: #1a1a22; }
    body.cb-popup {
      display: flex;
      flex-direction: column;
      width: 380px;
      margin: 24px auto;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(59,142,255,0.06) inset;
      overflow: hidden;
    }
    /* same inline styles as popup.html — kept in sync */
    .cb-statusrow { padding: 4px 16px 0; }
    #status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 8px; height: 22px; border-radius: 6px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px; letter-spacing: 0.02em;
      background: rgba(120,170,255,0.06);
      border: 1px solid var(--cb-line);
      color: var(--cb-text-dim);
    }
    #status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--cb-azure-soft); flex-shrink: 0;
      animation: cb-pulse 1.8s ease-out infinite;
    }
    #status.ok { color: #c7f5db; background: rgba(47,226,138,0.08); border-color: rgba(47,226,138,0.30); }
    #status.ok::before { background: var(--cb-green); }
    #status.err { color: #ffd0c2; background: rgba(255,120,90,0.08); border-color: rgba(255,120,90,0.38); }
    #status.err::before { background: #ff8c64; }

    .cb-hero { padding: 6px 18px 0; }
    .cb-hero .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--cb-azure-soft);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .cb-hero .eyebrow .dot {
      width: 6px; height: 6px; border-radius: 3px; background: var(--cb-azure);
      box-shadow: 0 0 8px var(--cb-azure);
    }
    .cb-hero h2 {
      margin: 8px 0 0;
      font-size: 34px; line-height: 0.95; font-weight: 800;
      letter-spacing: -0.035em; color: #fff;
    }
    .cb-hero h2 .grad {
      background: linear-gradient(180deg, #9cc8ff 0%, #3b8eff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .cb-hero p { margin: 8px 0 0; font-size: 12px; color: var(--cb-text-dim); line-height: 1.45; max-width: 280px; }

    .cb-section { padding: 12px 16px 0; }
    .cb-select {
      width: 100%; appearance: none; -webkit-appearance: none;
      height: 36px; padding: 0 28px 0 12px;
      border-radius: 10px;
      border: 1px solid var(--cb-line);
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%239aa6bd' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 10px center,
        rgba(255,255,255,0.02);
      color: var(--cb-text);
      font-family: 'Inter', sans-serif; font-size: 12px;
    }
    .cb-select option { background: #0a0e17; color: var(--cb-text); }

    .cb-actionrow { display: flex; gap: 8px; }
    #castBtn { flex: 1; }

    .cb-result { margin: 12px 16px 0; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.45; display: none; border: 1px solid var(--cb-line); white-space: pre-wrap; }
    .cb-result.ok { display: block; color: #c7f5db; background: rgba(47,226,138,0.08); border-color: rgba(47,226,138,0.30); }
    .cb-result.err { display: block; color: #ffd0c2; background: rgba(255,120,90,0.08); border-color: rgba(255,120,90,0.38); }

    .cb-hint { margin: 10px 16px 0; font-size: 11.5px; color: var(--cb-text-dim); line-height: 1.5; }
    .cb-hint:empty { display: none; }
    .cb-hint code {
      background: rgba(120,170,255,0.08);
      border: 1px solid var(--cb-line);
      padding: 1px 5px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px; color: var(--cb-azure-soft);
    }
    .cb-foot { margin-top: 16px; }

    /* preview-only mode picker overlay */
    .preview-bar {
      position: fixed; top: 12px; left: 12px; z-index: 99;
      display: flex; gap: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: #aab8cc;
    }
    .preview-bar a {
      padding: 4px 8px; border-radius: 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(120,170,255,0.18);
      color: inherit; text-decoration: none;
    }
    .preview-bar a.on { background: rgba(59,142,255,0.18); border-color: rgba(59,142,255,0.5); color: #fff; }
  </style>
</head>
<body class="cb-popup">

  <div class="preview-bar">
    <span style="opacity:.6">preview mode:</span>
    <a href="?mode=idle" data-mode="idle">idle</a>
    <a href="?mode=picker" data-mode="picker">picker</a>
    <a href="?mode=err" data-mode="err">err</a>
    <a href="?mode=playing" data-mode="playing">playing</a>
    <a href="?mode=paused" data-mode="paused">paused</a>
  </div>

  <header class="cb-titlebar">
    <div class="cb-logo">
      <div class="mark" aria-hidden="true"><div class="dot"></div></div>
      <div>
        <span class="name">Castbooster</span><span class="sub"> · 0.1</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="cb-upgrade" type="button" aria-label="Upgrade to Pro">
        <span class="spark" aria-hidden="true"></span> Get Pro
      </button>
      <button class="cb-iconbtn" type="button" aria-label="Settings" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.3 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="cb-statusrow"><span id="status">Connecting…</span></div>

  <section class="cb-hero" id="heroArea">
    <div class="eyebrow"><span class="dot"></span> standing by</div>
    <h2>Ready to<br><span class="grad">boost.</span></h2>
    <p>Open any stream in this tab and Castbooster will force it into HD on your Chromecast.</p>
  </section>

  <section class="cb-section" id="deviceArea" hidden>
    <div class="cb-rule">cast to</div>
    <div class="cb-dd" id="devicesDD" data-open="false">
      <button type="button" class="cb-dd-trigger" id="devicesTrigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Chromecast device">
        <span class="cb-dd-label" id="devicesLabel">Select a Chromecast…</span>
        <svg class="cb-dd-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="cb-dd-menu" id="devicesMenu" role="listbox" tabindex="-1"></div>
    </div>
  </section>

  <section class="cb-section cb-actionrow" id="actionRow" hidden>
    <button class="cb-btn" id="castBtn" disabled>
      <span class="cb-btn-label">Cast</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
    </button>
  </section>

  <div id="result" class="cb-result"></div>
  <div id="hint" class="cb-hint"></div>

  <!-- PLAYER MODE — full markup mirrors popup.html so playing/paused render visually -->
  <section id="playerArea" hidden data-state="playing">

    <div class="cb-stage-wrap">
      <div class="cb-stage" id="mcStage">
        <div class="silhouette" aria-hidden="true"></div>
        <span class="live"><span class="dot"></span>On Air</span>
        <span class="resbadge" id="mcResBadge">1080p · FORCED</span>
        <div class="stagetv">
          <div class="ck" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </div>
          <div class="lbl">Casting to <span id="mcDeviceNameStage">—</span></div>
        </div>
      </div>
    </div>

    <div class="cb-title-rowwrap">
      <div class="cb-title-row">
        <div class="info">
          <div class="name" id="mcTitle">—</div>
          <div class="host" id="mcDevice">—</div>
        </div>
      </div>
    </div>

    <div class="cb-scrub-wrap">
      <div class="cb-scrub">
        <input type="range" id="mcScrubber" min="0" max="100" value="0" step="0.1" disabled aria-label="Seek">
        <div class="ts">
          <span id="mcCurrent">0:00</span>
          <span id="mcDuration">--:--</span>
        </div>
      </div>
    </div>

    <div class="cb-transport-wrap">
      <div class="cb-transport">
        <div class="cb-transport-cluster">
          <button class="cb-tbtn" id="mcBack10" type="button" aria-label="Back 10 seconds" title="Back 10s">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="transform:scaleX(-1)">
              <path d="M5 5v14l9-7z"/><rect x="16" y="5" width="3" height="14" rx="0.8"/>
            </svg>
          </button>
          <button class="cb-tbtn primary" id="mcPlayPause" type="button" data-glyph="play" aria-label="Play/pause" title="Play/Pause">
            <svg class="glyph-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="glyph-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
            <svg class="glyph-wait" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 0 1 9 9"/></svg>
            <svg class="glyph-err" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
          </button>
          <button class="cb-tbtn" id="mcFwd10" type="button" aria-label="Forward 10 seconds" title="Forward 10s">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14l9-7z"/><rect x="16" y="5" width="3" height="14" rx="0.8"/></svg>
          </button>
        </div>
        <div class="spacer"></div>
        <div class="cb-vol">
          <button class="cb-tbtn" id="mcVolDown" type="button" aria-label="Volume down" title="Volume −">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/>
              <line x1="16" y1="12" x2="22" y2="12"/>
            </svg>
          </button>
          <button class="cb-tbtn" id="mcVolUp" type="button" aria-label="Volume up" title="Volume +">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/>
              <line x1="19" y1="9" x2="19" y2="15"/>
              <line x1="16" y1="12" x2="22" y2="12"/>
            </svg>
          </button>
          <span class="cb-vol-readout" id="mcVolReadout" aria-live="polite"></span>
        </div>
        <button class="cb-tbtn danger" id="mcStop" type="button" aria-label="Stop casting" title="Stop casting">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="5" width="19" height="13" rx="2.2"/>
            <path d="M2.5 18l9-7 9 7"/>
            <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <footer class="cb-foot">
    <a href="#" tabindex="-1">help</a>
  </footer>

  <script>
    // chrome.* stub — answers like the requested preview mode
    const mode = new URLSearchParams(location.search).get('mode') || 'idle';
    document.querySelectorAll('.preview-bar a').forEach((a) => {
      if (a.dataset.mode === mode) a.classList.add('on');
    });

    const SAMPLE_CANDIDATES = [
      { url: 'https://stream.example.com/master.m3u8', label: 'HLS master • from <video>', score: 120 },
      { url: 'https://cdn.example.com/v/big_buck_bunny.mp4', label: 'MP4 • 24.3 MB • sniffed', score: 90 },
      { url: 'https://embed.example.com/player?id=abc123', label: 'Player page (embed.example.com) • fallback', score: 40 },
    ];
    const SAMPLE_DEVICES = [
      { uuid: '11111111-1111-1111-1111-111111111111', name: 'Living-Room TV', model: 'Chromecast 4K' },
      { uuid: '22222222-2222-2222-2222-222222222222', name: 'Bedroom Hub', model: 'Nest Hub Max' },
    ];

    const PLAYER_MODES = new Set(['playing', 'paused']);
    const FAKE_CAST = {
      castUuid: SAMPLE_DEVICES[0].uuid,
      deviceName: SAMPLE_DEVICES[0].name,
      upstreamUrl: 'https://plex.local/library/movie/the-northman',
      startedAt: Date.now() - 5 * 60 * 1000,
    };
    function mediaStatusForMode() {
      if (mode === 'playing') {
        return { state: 'PLAYING', idleReason: null, title: 'The Northman', deviceName: FAKE_CAST.deviceName, duration: 8228, currentTime: 3102, canSeek: true, resolutionLabel: '1080p', volume: 0.55 };
      }
      if (mode === 'paused') {
        return { state: 'PAUSED', idleReason: null, title: 'The Northman', deviceName: FAKE_CAST.deviceName, duration: 8228, currentTime: 3102, canSeek: true, resolutionLabel: '1080p', volume: 0.55 };
      }
      return { state: 'IDLE', idleReason: 'FINISHED' };
    }

    window.chrome = {
      runtime: {
        sendMessage: async (msg) => {
          if (msg.type === 'NM_SEND') {
            const p = msg.payload || {};
            if (p.type === 'ping') {
              if (mode === 'err') throw new Error('Specified native messaging host not found.');
              return { ok: true, resp: { type: 'pong', version: '1.4.2', lanIp: '192.168.1.42' } };
            }
            if (p.type === 'list_casts') {
              return { ok: true, resp: { type: 'casts', casts: SAMPLE_DEVICES } };
            }
            if (p.type === 'media_status') {
              return { ok: true, resp: mediaStatusForMode() };
            }
            if (p.type === 'media_cmd') {
              return { ok: true, resp: { status: 'ok' } };
            }
            return { ok: true, resp: {} };
          }
          if (msg.type === 'GET_STATE') {
            return mode === 'picker'
              ? { iframes: [], dom: null, captures: SAMPLE_CANDIDATES.map(c => ({ url: c.url, type: 'm3u8', score: c.score, contentLength: 25000000 })) }
              : { iframes: [], dom: null, captures: [] };
          }
          return null;
        },
      },
      tabs: {
        query: async () => [{ id: 1, url: 'https://example-streaming.com/watch' }],
      },
      storage: {
        local: {
          get: async (key) => (PLAYER_MODES.has(mode) ? { activeCast: FAKE_CAST } : {}),
          remove: async () => {},
        },
      },
    };
  </script>
  <script src="popup.js"></script>
</body>
</html>
